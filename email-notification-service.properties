server.port=${EMAIL_SERVICE_PORT:8084}

spring.data.mongodb.uri=mongodb://${KARTYAVYA_MONGODB_HOST:localhost}:${KARTYAVYA_MONGODB_PORT:27017}/${KARTYAVYA_NOTIFICATION_MONGODB_DATABASE:notification_db}
spring.rabbitmq.host=${KARTYAVYA_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${KARTYAVYA_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${KARTYAVYA_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${KARTYAVYA_RABBITMQ_PASSWORD:guest}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

security.jwt.secret=${KARTYAVYA_JWT_SECRET}
security.jwt.issuer=${KARTYAVYA_JWT_ISSUER:kartyavya-access-service}
security.jwt.audience=${KARTYAVYA_JWT_AUDIENCE:kartyavya-api}

email.delivery.enabled=${KARTYAVYA_EMAIL_DELIVERY_ENABLED:false}
email.from=${KARTYAVYA_MAIL_FROM:no-reply@kartyavya.local}
spring.mail.host=${KARTYAVYA_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${KARTYAVYA_MAIL_PORT:587}
spring.mail.username=${KARTYAVYA_MAIL_USERNAME:}
spring.mail.password=${KARTYAVYA_MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${KARTYAVYA_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${KARTYAVYA_MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${KARTYAVYA_MAIL_STARTTLS_REQUIRED:true}

management.health.mail.enabled=${KARTYAVYA_EMAIL_DELIVERY_ENABLED:false}
