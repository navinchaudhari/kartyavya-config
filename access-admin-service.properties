server.port=${ACCESS_SERVICE_PORT:8081}

spring.datasource.url=jdbc:mysql://${KARTYAVYA_MYSQL_HOST:localhost}:${KARTYAVYA_MYSQL_PORT:3306}/${KARTYAVYA_ACCESS_DB_NAME:access_db}?useSSL=${KARTYAVYA_MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=${KARTYAVYA_MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=${KARTYAVYA_MYSQL_SERVER_TIMEZONE:UTC}
spring.datasource.username=${KARTYAVYA_MYSQL_USER:kartyavya}
spring.datasource.password=${KARTYAVYA_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${KARTYAVYA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=${KARTYAVYA_TIME_ZONE:UTC}
spring.jpa.properties.hibernate.format_sql=${KARTYAVYA_HIBERNATE_FORMAT_SQL:false}

spring.rabbitmq.host=${KARTYAVYA_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${KARTYAVYA_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${KARTYAVYA_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${KARTYAVYA_RABBITMQ_PASSWORD:guest}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
security.jwt.secret=${KARTYAVYA_JWT_SECRET}
security.jwt.issuer=${KARTYAVYA_JWT_ISSUER:kartyavya-access-service}
security.jwt.audience=${KARTYAVYA_JWT_AUDIENCE:kartyavya-api}
security.jwt.expiry-minutes=${KARTYAVYA_JWT_EXPIRY_MINUTES:60}
security.internal-key=${KARTYAVYA_INTERNAL_SERVICE_KEY}

app.seed.admin.email=${KARTYAVYA_ADMIN_EMAIL:admin@kartyavya.local}
app.seed.admin.password=${KARTYAVYA_ADMIN_PASSWORD}
app.seed.admin.full-name=${KARTYAVYA_ADMIN_FULL_NAME:System Administrator}
app.seed.admin.mobile=${KARTYAVYA_ADMIN_MOBILE:9999999999}
app.seed.admin.address=${KARTYAVYA_ADMIN_ADDRESS:Municipal Corporation Office}

springdoc.swagger-ui.path=${KARTYAVYA_SWAGGER_UI_PATH:/swagger-ui.html}
