server.port=${AI_SERVICE_PORT:8083}

spring.data.mongodb.uri=mongodb://${KARTYAVYA_MONGODB_HOST:localhost}:${KARTYAVYA_MONGODB_PORT:27017}/${KARTYAVYA_AI_MONGODB_DATABASE:ai_analytics_db}
spring.rabbitmq.host=${KARTYAVYA_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${KARTYAVYA_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${KARTYAVYA_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${KARTYAVYA_RABBITMQ_PASSWORD:guest}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

security.jwt.secret=${KARTYAVYA_JWT_SECRET}
security.jwt.issuer=${KARTYAVYA_JWT_ISSUER:kartyavya-access-service}
security.jwt.audience=${KARTYAVYA_JWT_AUDIENCE:kartyavya-api}
security.internal-key=${KARTYAVYA_INTERNAL_SERVICE_KEY}

ai.gemini.enabled=${KARTYAVYA_GEMINI_ENABLED:true}
ai.gemini.api-key=${KARTYAVYA_GEMINI_API_KEY:}
ai.gemini.model=${KARTYAVYA_GEMINI_MODEL:gemini-3.1-flash-lite}
ai.gemini.base-url=${KARTYAVYA_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
ai.gemini.temperature=${KARTYAVYA_GEMINI_TEMPERATURE:0.10}
ai.gemini.connect-timeout-seconds=${KARTYAVYA_GEMINI_CONNECT_TIMEOUT_SECONDS:10}
ai.gemini.read-timeout-seconds=${KARTYAVYA_GEMINI_READ_TIMEOUT_SECONDS:45}
ai.gemini.hotspot-cache-minutes=${KARTYAVYA_GEMINI_HOTSPOT_CACHE_MINUTES:5}

springdoc.swagger-ui.path=${KARTYAVYA_SWAGGER_UI_PATH:/swagger-ui.html}
