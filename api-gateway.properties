server.port=${API_GATEWAY_PORT:8080}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

security.jwt.secret=${KARTYAVYA_JWT_SECRET}
security.jwt.issuer=${KARTYAVYA_JWT_ISSUER:kartyavya-access-service}
security.jwt.audience=${KARTYAVYA_JWT_AUDIENCE:kartyavya-api}
app.cors.allowed-origins=${KARTYAVYA_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

spring.cloud.gateway.server.webflux.routes[0].id=access-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://access-admin-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/citizen/**,/api/admin/users/**,/api/admin/officers/**,/api/departments/**,/api/admin/departments/**,/api/admin/routing-rules/**

spring.cloud.gateway.server.webflux.routes[1].id=reports
spring.cloud.gateway.server.webflux.routes[1].uri=lb://civic-report-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/reports/**,/api/officer/**,/api/admin/reports/**,/api/dashboard/**,/uploads/**

spring.cloud.gateway.server.webflux.routes[2].id=ai
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ai-analytics-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/ai/**,/api/analytics/**

spring.cloud.gateway.server.webflux.routes[3].id=email
spring.cloud.gateway.server.webflux.routes[3].uri=lb://email-notification-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**
