server.port=${REPORT_SERVICE_PORT:8082}

spring.datasource.url=jdbc:mysql://${KARTYAVYA_MYSQL_HOST:localhost}:${KARTYAVYA_MYSQL_PORT:3306}/${KARTYAVYA_REPORT_DB_NAME:report_db}?useSSL=${KARTYAVYA_MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=${KARTYAVYA_MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&serverTimezone=${KARTYAVYA_MYSQL_SERVER_TIMEZONE:UTC}
spring.datasource.username=${KARTYAVYA_MYSQL_USER:kartyavya}
spring.datasource.password=${KARTYAVYA_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${KARTYAVYA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=${KARTYAVYA_TIME_ZONE:UTC}
spring.jpa.properties.hibernate.format_sql=${KARTYAVYA_HIBERNATE_FORMAT_SQL:false}

spring.rabbitmq.host=${KARTYAVYA_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${KARTYAVYA_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${KARTYAVYA_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${KARTYAVYA_RABBITMQ_PASSWORD:guest}

spring.servlet.multipart.max-file-size=${KARTYAVYA_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${KARTYAVYA_MAX_REQUEST_SIZE:6MB}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
security.jwt.secret=${KARTYAVYA_JWT_SECRET}
security.jwt.issuer=${KARTYAVYA_JWT_ISSUER:kartyavya-access-service}
security.jwt.audience=${KARTYAVYA_JWT_AUDIENCE:kartyavya-api}
security.internal-key=${KARTYAVYA_INTERNAL_SERVICE_KEY}
storage.root=${KARTYAVYA_UPLOAD_ROOT:./uploads}
municipality.min-latitude=${KARTYAVYA_MIN_LATITUDE:18.0}
municipality.max-latitude=${KARTYAVYA_MAX_LATITUDE:22.5}
municipality.min-longitude=${KARTYAVYA_MIN_LONGITUDE:72.0}
municipality.max-longitude=${KARTYAVYA_MAX_LONGITUDE:80.5}
springdoc.swagger-ui.path=${KARTYAVYA_SWAGGER_UI_PATH:/swagger-ui.html}
