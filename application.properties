management.endpoints.web.exposure.include=${KARTYAVYA_ACTUATOR_EXPOSURE:health,info}
management.endpoint.health.show-details=${KARTYAVYA_HEALTH_SHOW_DETAILS:never}
logging.pattern.level=%5p [${spring.application.name:unknown},%X{correlationId:-}]
spring.jackson.time-zone=${KARTYAVYA_TIME_ZONE:UTC}
server.address=${KARTYAVYA_SERVICE_BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.ip-address=${EUREKA_INSTANCE_IP:127.0.0.1}
eureka.instance.hostname=${EUREKA_HOST:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}
